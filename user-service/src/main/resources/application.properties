# ==========================
# Application Configuration
# ==========================
spring.application.name=USER-SERVICE
server.port=${PORT:8082}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ==========================
# MySQL Database Configuration (Local Development)
# ==========================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:userdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA / Hibernate Configuration
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# JWT Security Configuration
# ==========================
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

# ==========================
# Actuator & Health Probes Configuration
# ==========================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.probes.enabled=true

# ==========================
# Graceful Shutdown Configuration
# ==========================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ==========================
# Logging Configuration
# ==========================
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.hamarashops.userservice=INFO
