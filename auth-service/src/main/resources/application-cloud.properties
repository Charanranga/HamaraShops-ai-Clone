spring.application.name=AUTH-SERVICE

server.port=${PORT:8081}

spring.datasource.url=jdbc:mysql:///${DB_NAME:auth1db}?socketFactory=com.google.cloud.sql.mysql.SocketFactory&cloudSqlInstance=${INSTANCE_CONNECTION_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=86400000
jwt.refresh-token.expiration-ms=604800000

# Disable Eureka Discovery and Registration for Cloud Profile
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Inter-service URLs for direct communication in Cloud Profile
user.service.url=${USER_SERVICE_URL:http://localhost:8082}/users
audit.service.url=${AUDIT_SERVICE_URL:http://localhost:8085}/audit
