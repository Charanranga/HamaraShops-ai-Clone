# Application Name
spring.application.name=api-gateway

# Server Port
server.port=${PORT:8080}

# Eureka Client Discovery Registration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.probes.enabled=true
management.info.env.enabled=true

# Graceful Shutdown Configuration
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Application Metadata Info
info.app.name=HamaraShops API Gateway
info.app.description=Independent API Gateway Microservice for HamaraShops Platform
info.app.version=1.0.0

# Standard Spring Boot Logging Levels
logging.level.root=INFO
logging.level.com.hamarashops.apigateway=INFO
