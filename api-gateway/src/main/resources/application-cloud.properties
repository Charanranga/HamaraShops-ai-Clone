# Dynamic Server Port provided by Cloud Run runtime environment
server.port=${PORT:8080}

# Application Name
spring.application.name=api-gateway

# Disable Eureka Discovery and Registration for Cloud Profile
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Cloud Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.health.probes.enabled=true

# Cloud Logging Configuration
logging.level.root=INFO
logging.level.com.hamarashops.apigateway=INFO

# Cloud Run target service URLs for direct routing
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}
user.service.url=${USER_SERVICE_URL:http://localhost:8082}
candidate.service.url=${CANDIDATE_SERVICE_URL:http://localhost:8083}
document.service.url=${DOCUMENT_SERVICE_URL:http://localhost:8084}
audit.service.url=${AUDIT_SERVICE_URL:http://localhost:8085}
