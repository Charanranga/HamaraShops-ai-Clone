spring.application.name=CANDIDATE-SERVICE
server.port=${PORT:8083}

# GCP Cloud SQL Connection String Configuration
spring.datasource.url=jdbc:mysql:///${DB_NAME:candidatedb}?socketFactory=com.google.cloud.sql.mysql.SocketFactory&cloudSqlInstance=${INSTANCE_CONNECTION_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Hibernate Cloud Dialect Setup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable Eureka Discovery and Registration for Cloud Profile
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Audit Service URL for direct communication in Cloud Profile
audit.service.url=${AUDIT_SERVICE_URL:http://localhost:8085}/audit
